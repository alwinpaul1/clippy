# 4G heap is ample for a Flutter/Gradle+Kotlin build; the Rust/native work
# (cargokit, clang) runs outside this JVM. -Xmx8G + 4G metaspace let one
# daemon grow to half of a 16 GB machine and pushed the whole box into swap.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# super_clipboard's cargokit uses project.exec {}, which the Gradle 9
# configuration cache forbids (causing flaky "Could not find method exec()"
# failures). Disable the config cache for reliable native builds.
org.gradle.configuration-cache=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
