name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  # ---- Gates: tests must pass before anything ships ----
  app:
    name: App — analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test # includes the in-process relay integration tests
      - name: Android FGS type must be specialUse (never dataSync)
        # The type is declared twice — manifest + startService — and a drift
        # only fails at RUNTIME, silently: startForeground throws, the service
        # dies, and the app still shows "Synced" because the UI holds its own
        # connection. dataSync additionally carries Android 15+'s 6h/24h cap,
        # which killed background sync for a day at a time (1.0.29).
        run: |
          set -e
          M=android/app/src/main/AndroidManifest.xml
          D=lib/platform/foreground_service.dart
          # Match DECLARATIONS only — the comments in both files legitimately
          # explain why dataSync is banned, so a bare word-grep would fail here.
          grep -q 'android:foregroundServiceType="specialUse"' "$M" \
            || { echo "::error::$M must declare foregroundServiceType=\"specialUse\""; exit 1; }
          grep -q 'serviceTypes: const \[ForegroundServiceTypes.specialUse\]' "$D" \
            || { echo "::error::$D must start the service with ForegroundServiceTypes.specialUse"; exit 1; }
          ! grep -q 'android:foregroundServiceType="[^"]*dataSync' "$M" \
            || { echo "::error::$M declares dataSync — capped at 6h/24h by Android 15+, which kills background sync"; exit 1; }
          ! grep -q 'ForegroundServiceTypes\.dataSync' "$D" \
            || { echo "::error::$D starts the service as dataSync — capped at 6h/24h by Android 15+"; exit 1; }
          echo "FGS type guard OK: specialUse declared in manifest + Dart, dataSync used nowhere."

  relay:
    name: Relay — analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - working-directory: server
        run: dart pub get
      - working-directory: server
        run: dart analyze
      - working-directory: server
        run: dart test

  # ---- Build the distributable binaries (only after the app gate passes) ----
  build-android:
    name: Build Android APK
    needs: [app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # super_clipboard's cargokit falls back to a Rust source build if the
      # precompiled binary download fails; a toolchain avoids that flake.
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Decode release keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/clippy-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/clippy-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore configured — build will be release-signed."
          else
            echo "No release keystore secret set — falling back to debug signing."
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-macos:
    name: Build macOS app
    needs: [app]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package as DMG (drag-to-Applications)
        run: |
          mkdir dmg
          cp -R build/macos/Build/Products/Release/clippy.app "dmg/Clippy.app"
          ln -s /Applications dmg/Applications
          hdiutil create -volname Clippy -srcfolder dmg -ov -format UDZO Clippy-macOS.dmg
      - name: Zip the .app (for in-app self-update)
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/clippy.app Clippy-macOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: |
            Clippy-macOS.dmg
            Clippy-macOS.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows app
    needs: [app]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # super_clipboard's cargokit builds Rust on Windows too.
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Build installer (Inno Setup, version from pubspec)
        shell: pwsh
        run: |
          $line = (Select-String -Path pubspec.yaml -Pattern '^version:').Line
          $full = ($line -replace 'version:\s*', '').Trim()
          $semver = ($full -split '\+')[0]
          Write-Host "Inno AppVersion=$semver (from pubspec $full)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$semver" windows\installer.iss
      # Optional Authenticode sign when secrets are present. Do NOT gate on
      # `if: secrets.*` (GitHub rejects secret comparisons in some workflows);
      # skip inside the script instead. Without a cert, SmartScreen still warns.
      # Secrets: WINDOWS_CERT_PFX_BASE64 + WINDOWS_CERT_PASSWORD
      # (Azure Trusted Signing: see docs/windows-code-signing.md).
      - name: Sign Clippy-Setup.exe (Authenticode, optional)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERT_PFX_BASE64)) {
            Write-Host '::notice::WINDOWS_CERT_PFX_BASE64 not set — Clippy-Setup.exe is UNSIGNED.'
            Write-Host 'SmartScreen will warn until a code-signing cert is added (docs/windows-code-signing.md).'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'clippy-code-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe not found on runner' }
          Write-Host "Using $signtool"
          & $signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            /d "Clippy" Clippy-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed: $LASTEXITCODE" }
          & $signtool verify /pa /v Clippy-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed: $LASTEXITCODE" }
          Remove-Item $pfx -Force
          Write-Host 'Clippy-Setup.exe signed and verified'
      # Free OSS path: SignPath Foundation (after apply + secrets). See
      # docs/windows-code-signing.md.
      - name: Upload unsigned installer for SignPath
        id: upload-unsigned-windows
        uses: actions/upload-artifact@v7
        with:
          name: windows-setup-unsigned
          path: Clippy-Setup.exe
          if-no-files-found: error
      # Runs only when SIGNPATH_API_TOKEN is set (checked in a prior shell step via env).
      # Until Alwin completes SignPath approval, this step is skipped cleanly.
      - name: Check SignPath configuration
        id: signpath-cfg
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:SIGNPATH_API_TOKEN)) {
            echo "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host '::notice::SIGNPATH_API_TOKEN not set — skip free OSS signing (apply at signpath.org).'
          } else {
            echo "enabled=true" >> $env:GITHUB_OUTPUT
          }
      - name: Sign via SignPath (free OSS, when configured)
        if: steps.signpath-cfg.outputs.enabled == 'true'
        id: signpath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ github.workspace }}/signed-windows
      - name: Prefer SignPath-signed installer when present
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path "${{ github.workspace }}\signed-windows" -Recurse -Filter 'Clippy-Setup.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($signed) {
            Copy-Item $signed.FullName -Destination Clippy-Setup.exe -Force
            Write-Host "Using SignPath-signed installer: $($signed.FullName)"
          } else {
            Write-Host '::notice::No SignPath-signed binary — shipping PFX-signed or unsigned Clippy-Setup.exe.'
          }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-setup
          path: Clippy-Setup.exe
          if-no-files-found: error

  # ---- Deploy relay + download page + fresh builds to VPS (clippy.alwinpaul.me) ----
  # Railway was retired. Relay runs on the VPS via Docker + Caddy.
  # Auto-deploy needs repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY.
  deploy:
    name: Deploy to VPS
    needs: [app, relay, build-android, build-macos, build-windows]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: _dl
      - uses: actions/download-artifact@v8
        with:
          name: macos-dmg
          path: _dl
      - uses: actions/download-artifact@v8
        with:
          name: windows-setup
          path: _dl
      - name: Stage builds for hosting
        run: |
          mkdir -p server/web/downloads
          cp _dl/app-release.apk server/web/downloads/Clippy-Android.apk
          cp _dl/Clippy-macOS.dmg server/web/downloads/Clippy-macOS.dmg
          cp _dl/Clippy-macOS.zip server/web/downloads/Clippy-macOS.zip
          cp _dl/Clippy-Setup.exe server/web/downloads/Clippy-Setup.exe
          ls -la server/web/downloads
      - name: Generate update manifest (version.json)
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '[:space:]')
          SEMVER=${VER%%+*}; BUILD=${VER##*+}
          python3 - "$SEMVER" "$BUILD" <<'PY'
          import json, sys, hashlib, os
          rel = json.load(open('release.json'))
          # Guard: the changelog must have been written FOR this version.
          # Without this, bumping pubspec while forgetting release.json ships
          # the previous release's notes under the new version number.
          if rel.get('version') != sys.argv[1]:
              sys.exit(f"release.json version {rel.get('version')!r} != "
                       f"pubspec {sys.argv[1]!r} — update release.json's "
                       "version and notes as part of every release.")
          # SHA-256 of each artifact the IN-APP UPDATER installs. The client
          # verifies this before installing and REFUSES to update without a
          # match, so every artifact named below MUST exist — a missing one is a
          # broken build, not a silent no-hash download. (Clippy-macOS.dmg is the
          # manual browser-download path only; the updater uses the .zip, so the
          # manifest carries the .zip hash. The .dmg is not auto-installed.)
          arts = {'android': 'Clippy-Android.apk',
                  'macos':   'Clippy-macOS.zip',
                  'windows': 'Clippy-Setup.exe'}
          sha = {}
          for k, name in arts.items():
              path = f'server/web/downloads/{name}'
              if not os.path.exists(path):
                  sys.exit(f'artifact {name} is missing — cannot publish a '
                           'manifest the client would refuse to install')
              sha[k] = hashlib.sha256(open(path, 'rb').read()).hexdigest()
          json.dump({
              'version': sys.argv[1], 'build': int(sys.argv[2]),
              'notes': rel['notes'],
              'android': '/download/Clippy-Android.apk',
              'macos':   '/download/Clippy-macOS.zip',
              'windows': '/download/Clippy-Setup.exe',
              'sha256': sha,
          }, open('server/web/downloads/version.json', 'w'))
          print(open('server/web/downloads/version.json').read())
          PY
      - name: Deploy to VPS (rsync + docker rebuild)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_HOST" ]; then
            echo "::notice::VPS_SSH_KEY / VPS_HOST not set — skipping remote deploy."
            echo "Relay is already on the VPS (clippy.alwinpaul.me). Add secrets to"
            echo "auto-push artifacts on each main merge, or rsync server/web/downloads manually."
            exit 0
          fi
          USER="${VPS_USER:-root}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/vps_key
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          # shellcheck disable=SC2029
          rsync -az -e "ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=accept-new" \
            server/ "${USER}@${VPS_HOST}:/opt/clippy/relay/"
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=accept-new "${USER}@${VPS_HOST}" \
            'set -e
             cd /opt/clippy/relay
             docker build -t clippy-relay:prod -f Dockerfile .
             docker rm -f clippy-relay 2>/dev/null || true
             docker run -d --name clippy-relay --restart unless-stopped \
               -p 127.0.0.1:8088:8080 \
               -e PORT=8080 -e DB_PATH=/data/clippy.json \
               -v /opt/clippy/data:/data \
               --stop-timeout 15 \
               clippy-relay:prod'
          EXPECT=$(grep -E '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '[:space:]')
          URL="https://clippy.alwinpaul.me/version.json"
          echo "Waiting for relay to serve $EXPECT ..."
          for i in $(seq 1 40); do
            GOT=$(curl -fsS "$URL" 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);print(f\"{d.get('version','')}+{d.get('build','')}\")" 2>/dev/null || true)
            echo "  poll $i: served=${GOT:-<none>} expect=$EXPECT"
            if [ "$GOT" = "$EXPECT" ]; then
              echo "::notice::Deploy verified — relay serving $EXPECT"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Relay did not serve $EXPECT within ~10 min — deploy may have failed."
          exit 1
